<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15382d"><meta name="description" content="Research information website for project R-26-IT-021, SLIIT.">
<title>Contact Us | Herbal Research</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/styles.css"></head>
<body data-page="contact"><div id="site-nav"></div><main id="main-content"><section class="page-hero"><div class="container"><div class="breadcrumb"><a href="index.html">Home</a> / Contact Us</div><h1 class="serif">Contact Us</h1><p>Contact the research team.</p></div></section>
<section class="section compact"><div class="container contact-grid">
<div class="contact-card"><h2 class="serif" style="font-size:30px">Research members</h2><div id="contact-members"></div></div>
<div class="contact-card"><h2 class="serif" style="font-size:30px">Send a message</h2>
<form id="contact-form" class="contact-form">
<div class="form-row"><div class="form-field"><label for="visitor-name">Name</label><input id="visitor-name" name="name" placeholder="Your name" required maxlength="120" autocomplete="name"></div><div class="form-field"><label for="visitor-email">Email</label><input id="visitor-email" name="email" type="email" placeholder="you@example.com" required maxlength="150" autocomplete="email"></div></div>
<div class="form-field"><label for="contact-subject">Subject</label><input id="contact-subject" name="subject" placeholder="Subject" required maxlength="140"></div>
<div class="form-field"><label for="contact-message">Message</label><textarea id="contact-message" name="message" placeholder="Your message" required minlength="10" maxlength="5000"></textarea></div>
<button type="submit" class="btn primary send-btn">Send Message →</button><p id="form-message" class="form-message" role="status" aria-live="polite"></p></form>
<p class="form-note">Opens your email app to message the research team.</p></div></div></section></main><div id="site-footer"></div><script src="assets/site.js"></script></body></html>
