<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15382d">
  <meta name="description" content="Contact the research group for project R-26-IT-021, SLIIT.">
  <title>Contact Us | Herbal Research</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="contact">
  <div id="site-nav"></div>
  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / Contact Us</div>
        <h1 class="serif">Contact Us</h1>
        <p>Send a message to the research team.</p>
      </div>
    </section>

    <section class="section compact">
      <div class="container contact-grid">
        <div class="contact-card">
          <h2 class="serif" style="font-size:30px">Research members</h2>
          <div id="contact-members"></div>
        </div>

        <div class="contact-card">
          <h2 class="serif" style="font-size:30px">Send a message</h2>

          <form id="research-contact-form" class="contact-form"
                action="https://formspree.io/f/xeaekved" method="POST">
            <div class="form-row">
              <div class="form-field">
                <label for="visitor-name">Name</label>
                <input id="visitor-name" name="name" placeholder="Your name"
                       autocomplete="name" required maxlength="120">
              </div>
              <div class="form-field">
                <label for="visitor-email">Email</label>
                <input id="visitor-email" name="email" type="email"
                       placeholder="you@example.com" autocomplete="email"
                       required maxlength="150">
              </div>
            </div>

            <div class="form-field">
              <label for="contact-subject">Subject</label>
              <input id="contact-subject" name="subject" placeholder="Subject"
                     required maxlength="140">
            </div>

            <div class="form-field">
              <label for="contact-message">Message</label>
              <textarea id="contact-message" name="message"
                        placeholder="Your message" required minlength="10"
                        maxlength="5000"></textarea>
            </div>

          
            <div aria-hidden="true" style="position:absolute;left:-9999px;height:1px;overflow:hidden">
              <label for="contact-website">Website</label>
              <input id="contact-website" type="text" name="website"
                     tabindex="-1" autocomplete="off">
            </div>

            <input type="hidden" name="project" value="R-26-IT-021 · Herbal Research">
            <button type="submit" class="btn primary send-btn">Send Message →</button>
            <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          </form>
          <p class="form-note">Please avoid sharing sensitive medical or personal information.</p>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/site.js"></script>
  <script>
   
    (() => {
      const form = document.getElementById('research-contact-form');
      const feedback = document.getElementById('form-message');
      const button = form.querySelector('[type="submit"]');

      function showStatus(message, ok) {
        feedback.className = 'form-message ' + (ok ? 'success' : 'error');
        feedback.textContent = message;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        if (form.elements.website.value.trim()) return;

        const endpoint = form.getAttribute('action');
        if (endpoint.includes('PASTE_YOUR_FORM_ID')) {
          showStatus('Contact form setup is not complete. Please configure the Formspree form ID.', false);
          return;
        }

        button.disabled = true;
        button.textContent = 'Sending…';
        feedback.textContent = '';

        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
          });

          if (response.ok) {
            form.reset();
            showStatus('Your message was submitted successfully.', true);
          } else {
            let message = 'Message could not be sent. Please try again.';
            try {
              const result = await response.json();
              if (Array.isArray(result.errors) && result.errors.length) {
                message = result.errors.map(error => error.message).filter(Boolean).join(' ');
              }
            } catch (_) {}
            showStatus(message, false);
          }
        } catch (_) {
          showStatus('Could not connect to the message service. Check your internet connection and try again.', false);
        } finally {
          button.disabled = false;
          button.textContent = 'Send Message →';
        }
      });
    })();
  </script>
</body>
</html>
