
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15382d">

    <meta name="description"
          content="Research information website for project R-26-IT-021, SLIIT.">

    <title>Documents | Herbal Research</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles.css">
</head>

<body data-page="documents">

    <div id="site-nav"></div>

    <main id="main-content">

        <!-- PAGE HEADER -->
        <section class="page-hero">
            <div class="container">

                <div class="breadcrumb">
                    <a href="index.html">Home</a> / Documents
                </div>

                <h1 class="serif">Documents</h1>

                <p>Project proposals, reports and research files.</p>

            </div>
        </section>

       
        <section class="section compact">
            <div class="container">

                <div class="section-heading">
                    <h2 class="serif">Project documents</h2>
                </div>

               
                <div class="doc-tools">

                    <input
                        id="document-search"
                        type="search"
                        class="search-input"
                        aria-label="Search documents"
                        placeholder="Search documents"
                    >

                    <button class="filter-btn active"
                            data-filter="All">
                        All
                    </button>

                    <button class="filter-btn"
                            data-filter="Proposal">
                        Proposals
                    </button>

                    <button class="filter-btn"
                            data-filter="TAF">
                        TAF
                    </button>

                    <button class="filter-btn"
                            data-filter="Paper">
                        Paper
                    </button>

                    <button class="filter-btn"
                            data-filter="Final Report Draft">
                        Final Report Drafts
                    </button>

                </div>

                <div
                    id="document-grid"
                    class="doc-grid"
                    aria-live="polite">
                </div>

                
                <p
                    class="empty-state"
                    id="no-documents"
                    hidden>
                    No matching documents.
                </p>

            </div>
        </section>

    </main>

    <div id="site-footer"></div>

    <script src="assets/site.js"></script>

</body>
</html>
